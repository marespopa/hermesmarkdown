name: Create release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - trunk
    types:
      - closed

permissions:
  actions: write
  contents: write

concurrency:
  group: release-creation
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: next-client/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: next-client
        run: corepack yarn install --immutable

      - name: Verify release candidate
        working-directory: next-client
        run: |
          corepack yarn tsc --noEmit
          corepack yarn lint
          corepack yarn test --run
          corepack yarn build

      - name: Read release version
        id: version
        working-directory: next-client
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi

      - name: Create annotated tag
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Deploy tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh workflow run deploy-production.yml --ref trunk -f "release_ref=$TAG"
