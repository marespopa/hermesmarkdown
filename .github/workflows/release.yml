name: Create release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - trunk
    types:
      - closed

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: release-creation
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      # CI already ran typecheck, lint, tests and build on the PR (merged with
      # trunk), so the release only checks that run passed instead of repeating it.
      - name: Require passing CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            # Manual run: use the PR that produced trunk's head commit.
            HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/pulls" --jq '.[0].head.sha // empty')
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "No pull request found for trunk's head commit; can't confirm CI passed." >&2
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Verify%20application&filter=latest" --jq '.check_runs[0].conclusion // "missing"')
          echo "CI (Verify application) on $HEAD_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "CI didn't pass on the release PR, so no release is created." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Read release version
        id: version
        working-directory: next-client
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists." >&2
            exit 1
          fi

      - name: Create annotated tag
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Deploy tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh workflow run deploy-production.yml --ref trunk -f "release_ref=$TAG"
