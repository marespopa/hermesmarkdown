name: Roll back production

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable release tag or full commit SHA to deploy
        required: true
        type: string
      confirm_production_rollback:
        description: Type ROLLBACK to authorize the production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back to ${{ inputs.release_ref }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI_VERSION: 27.5.2
      RELEASE_REF: ${{ inputs.release_ref }}
      CONFIRMATION: ${{ inputs.confirm_production_rollback }}

    steps:
      - name: Confirm production rollback
        run: |
          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "Production rollback requires the confirmation value ROLLBACK." >&2
            exit 1
          fi

      - name: Check out selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Identify rollback release
        id: release
        working-directory: next-client
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy selected release
        run: npx --yes netlify-cli@$NETLIFY_CLI_VERSION deploy --prod --build --json > deploy.json

      - name: Smoke-test restored production deployment
        run: |
          url="$(node -p "require('./deploy.json').url")"
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 "$url"

      - name: Publish rollback summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          url="$(node -p "require('./deploy.json').url")"
          deploy_id="$(node -p "require('./deploy.json').id")"
          {
            echo "## Production rollback"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Requested ref | $RELEASE_REF |"
            echo "| Release version | v$VERSION |"
            echo "| Commit | $COMMIT |"
            echo "| Deploy ID | $deploy_id |"
            echo "| URL | [$url]($url) |"
          } >> "$GITHUB_STEP_SUMMARY"
