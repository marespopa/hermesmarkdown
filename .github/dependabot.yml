# Dependabot version updates. Security alerts are enabled separately in the
# repository settings. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # App dependencies (Yarn 4 workspace in next-client/).
  - package-ecosystem: "npm"
    directory: "/next-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into one PR to keep the queue short;
      # major versions still get their own PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used by the CI/CD workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
